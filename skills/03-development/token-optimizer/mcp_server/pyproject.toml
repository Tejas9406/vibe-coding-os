[project]
name = "token-optimizer-mcp"
version = "1.0.0"
description = "Token Optimizer MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "tree-sitter<0.22.0",
    "tree-sitter-languages>=1.10.2",
]

[project.scripts]
token-optimizer-mcp = "token_optimizer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_optimizer"]
